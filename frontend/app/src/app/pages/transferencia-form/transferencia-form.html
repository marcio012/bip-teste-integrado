<div class="container">
  <h2>Transferência</h2>

  <form (ngSubmit)="transferir()">
    <div class="form-grid">
      <label>Origem ID
        <input type="number" [(ngModel)]="origemId" name="origemId" required />
      </label>

      <label>Destino ID
        <input type="number" [(ngModel)]="destinoId" name="destinoId" required />
      </label>

      <label class="full">Valor
        <input type="number" step="0.01" [(ngModel)]="valor" name="valor" required />
      </label>
    </div>

    <div class="form-actions">
      <button type="submit" [disabled]="loading">Transferir</button>
    </div>
  </form>

  @if (msg) { <p class="error" [class]="msg.includes('realizada') ? 'badge-ok' : 'error'">{{ msg }}</p> }
</div>
