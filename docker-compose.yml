services:
  db:
    image: postgres:15
    container_name: bip_db
    environment:
      POSTGRES_USER: bip
      POSTGRES_PASSWORD: bip
      POSTGRES_DB: bip
    ports:
      - "5432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bip -d bip"]
      interval: 5s
      timeout: 3s
      retries: 20